# Configuración del brazo SO-101 follower (el que ejecuta los movimientos).
# Los scripts en scripts/ leen este archivo para construir los args de los
# comandos `lerobot-*`.
#
# Hardware:
#   - 6× motores Feetech STS3215 con reducción 1/345 en todos los joints
#   - IDs (en orden de la cadena daisy-chain):
#       1=shoulder_pan, 2=shoulder_lift, 3=elbow_flex,
#       4=wrist_flex,   5=wrist_roll,    6=gripper

type: so101_follower

# Puerto serial. Si instalaste udev/99-so101.rules, usa el symlink estable.
# Si no, descúbrelo con `bash scripts/00_find_ports.sh` y edítalo aquí.
port: /dev/tty.usbmodem5B141149291
# port: /dev/tty.usbmodem5B3D0447521

# ID lógico que LeRobot usa para guardar/leer la calibración.
# "papu" es el sobrenombre del follower en el lab (heredado de htovarm7/so101_ws).
# La calibración correspondiente está versionada en calibrations/papu.json y
# se enlaza a ~/.cache/huggingface/lerobot/calibration/so101_follower/ con
# `bash scripts/install_calibrations.sh`.
id: papu
