[project]
name = "dume"
version = "0.1.0"
description = "Operate the SO-101 robotic arm (leader + follower) on LeRobot: scriptable CLI `cal` + icon-rich TUI `dume`."
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Pablo Armando Mac Beth Milian" },
    { name = "José Luis Domínguez Morales" },
    { name = "Paola Llamas Hernández" },
    { name = "Jocelyn Anahid Velarde Barrón" },
    { name = "Héctor Eduardo Tovar Mendoza" },
]
keywords = [
    "robotics", "lerobot", "so-101", "so-arm101", "so-arm100",
    "imitation-learning", "behavioral-cloning", "vla",
    "vision-language-action", "smolvla", "act", "teleoperation",
    "feetech", "sts3215", "tui", "textual", "cli",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Natural Language :: English",
    "Natural Language :: Spanish",
]

dependencies = [
    # LeRobot con soporte Feetech (motores STS3215 del SO-101).
    # La fuente real (path editable al clone hermano) se define en [tool.uv.sources],
    # que es solo para dev: el wheel publicado depende de `lerobot[feetech]` desde PyPI.
    "lerobot[feetech]",
    # Utilidades del proyecto
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "rerun-sdk>=0.20",
    "depthai>=3.6.1",
    "lerobot-attention-visualizer>=0.1.2",
    # TUI DUM-E (`dume`): framework + gráficos por joint + imágenes inline de cámara
    "textual>=1.0",
    "textual-plotext>=1.0",
    "textual-image[textual]>=0.12",
]

[project.scripts]
# Un único comando `dume`: TUI (`dume`) + CLI scriptable (`dume run <subcomando>`).
# Instalado en el PATH del venv y disponible tras `pipx install` / `uv tool install`.
dume = "so101_cli.dume.__main__:main"

[project.urls]
Homepage = "https://github.com/armandomm09/dume"
Repository = "https://github.com/armandomm09/dume"
Documentation = "https://github.com/armandomm09/dume"
PyPI = "https://pypi.org/project/dume/"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# El paquete importable es `so101_cli` (el nombre de distribución es `dume`).
# hatchling incluye todos los archivos del paquete, incluido so101_cli/dume/dume.tcss.
packages = ["so101_cli"]

[tool.uv.sources]
# Dev-only: apunta al clone editable de huggingface/lerobot anidado en este repo.
# uv lo usa para resolver en local; NO termina en el wheel publicado.
lerobot = { path = "./lerobot", editable = true }

[tool.uv]
package = true
